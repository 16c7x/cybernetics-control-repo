---
version: 5

defaults:
  datadir: "data"

hierarchy:
  - name: "Yaml backend"
    data_hash: yaml_data
    paths:
      - "nodes/%{certname}.yaml"
      - "roles/%{role}.yaml"
      - "datacentre/%{location}.yaml"
      - "applications/%{application}.yaml"
      - "applications/%{application}/%{tier}.yaml"
      - "os/%{facts.os.name}.yaml"
      - "domain/%{::domain}.yaml"
      - "common.yaml"
